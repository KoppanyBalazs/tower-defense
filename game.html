<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiders: Viking Attack</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 class="text-center">Raiders: Viking Attack<img src="img/logo.png" alt="" class="logo object-justify-center"></h1>
    </header>
    <main>
        <section class="container-fluid">
            <div class="row">
                <div class="col-12 col-md-3 menu">
                    <p class="p-3 text-center"><a href="index.html" class="btn btn-outline-dark">Főmenü</a></p>
                    <p class="text-center">KÖR: <span class="round">0</span></p>
                    <div class="d-flex justify-content-center pt-2">
                        <p class="text-center pt-1">PÉNZ: <span class="pont"></span></p>
                        <img src="img/coin.png" alt="" class="coin">
                        <p class="text-center pt-1">HP: <span class="hp"></span></p>
                        <img src="img/sziv.png" alt="" class="coin">
                    </div>
                    <div class="d-flex flex-row justify-content-center mx-auto">
                        <img src="img/characters/mine.png" alt="magusosdi" class="kicsikep ms-5">
                        <button class="akna btn btn-warning me-5 ms-2">Akna 25g</button>
                    </div>
                    <div class="d-flex flex-row justify-content-center mt-2 mx-auto">
                        <img src="img/pyro_tower_icon.jpeg" alt="magusosdi" class="kicsikep ms-5">
                        <button class="lang btn btn-warning me-5 ms-2">Görögtűz torony 100g</button>
                    </div>
                    <div class="d-flex flex-row justify-content-center mt-2 mx-auto">
                        <img src="img/magus.png" alt="magus" class="kicsikep ms-5">
                        <button class="magus btn btn-warning me-5 ms-2">Mágus 150g</button>
                    </div>
                </div>
                <div class="col-12 col-md-9 game gamehatter"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>Better to die with honor than live with shame.</p>
    </footer>

    <div class="modal" tabindex="-1" id="myModal">
        <div class="modal-dialog ">
            <div class="modal-content">
                <div class="modal-header ">
                    <h5 class="modal-title ">Vesztettél!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body lose modal-body1">
                    <p>A vikingek felégettek mindent, elvitték az egyház aranyát és elrabolták a lakosokat!</p>

                </div>
                <div class="modal-footer justify-content-center modal-footer1">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><a href="index.html">Vissza a menübe</a></button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal" tabindex="-1" id="upgrades">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header ">
        <h5 class="modal-title">UPGRADES</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
<div class="modal-body upgrade">
    <p id="upgrade-">Modal body text goes infohere.</p>
    <img src="img/upgrade0.png" alt="" class="upgradebar" id="upgrade-bar">
    <button type="button" class="btn btn-secondary" id="upgrade-btn">Upgrade</button>
</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/Enemy.js"></script>
    <script src="js/Tower.js"></script>
    <script src="js/Bullet.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
